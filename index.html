<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Resume Editor – Ronald Sebastian</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<style>
/* ── DESIGN TOKENS ── */
:root{
  --primary:#004ac6;
  --primary-container:#2563eb;
  --primary-fixed:#dbe1ff;
  --primary-fixed-dim:#b4c5ff;
  --on-primary:#fff;
  --accent-focus:#1D4ED8;
  --accent-soft:#EFF6FF;
  --surface:#f8f9ff;
  --surface-sheet:#fff;
  --surface-container-lowest:#fff;
  --surface-container-low:#eff4ff;
  --surface-container:#e5eeff;
  --surface-container-high:#dce9ff;
  --surface-bright:#f8f9ff;
  --canvas-bg:#F1F5F9;
  --sidebar-bg:#fff;
  --on-surface:#0b1c30;
  --on-background:#0b1c30;
  --on-surface-variant:#434655;
  --text-primary:#0F172A;
  --text-muted:#64748B;
  --border-subtle:#E2E8F0;
  --border-strong:#CBD5E1;
  --outline:#737686;
  --outline-variant:#c3c6d7;
  --success:#10B981;
  --error:#ba1a1a;
  --warning:#F59E0B;
  --inverse-surface:#213145;
  --sw:320px;
  --topbar-h:56px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{font-size:13px;}
body{font-family:'Inter',system-ui,sans-serif;background:var(--canvas-bg);color:var(--text-primary);min-height:100vh;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased;}

/* ── MATERIAL SYMBOLS ── */
.ms{font-family:'Material Symbols Outlined';font-weight:normal;font-style:normal;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;word-wrap:normal;direction:ltr;font-size:18px;vertical-align:middle;user-select:none;}

/* ── TOPBAR ── */
#topbar{
  position:sticky;top:0;z-index:100;
  height:var(--topbar-h);
  display:flex;align-items:center;gap:8px;
  background:var(--surface-sheet);
  border-bottom:1px solid var(--border-subtle);
  padding:0 16px;
  box-shadow:0 1px 8px rgba(0,0,0,.04);
}
.tb-brand{display:flex;align-items:center;gap:8px;flex-shrink:0;}
.tb-brand-icon{width:28px;height:28px;border-radius:6px;background:var(--primary);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.tb-brand-icon .ms{color:#fff;font-size:16px;}
.tb-brand-name{font-size:.85rem;font-weight:700;color:var(--text-primary);letter-spacing:-.3px;}
.tb-doc{display:flex;align-items:center;gap:6px;}
.tb-doc-name{font-size:.8rem;font-weight:600;color:var(--text-primary);max-width:160px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tb-autosave{display:flex;align-items:center;gap:5px;padding:2px 8px;border-radius:20px;background:var(--surface-container-low);}
.tb-autosave-dot{width:6px;height:6px;border-radius:50%;background:var(--success);flex-shrink:0;}
.tb-autosave span{font-size:.68rem;font-weight:600;color:var(--text-muted);}
.tb-sep{width:1px;height:22px;background:var(--border-subtle);flex-shrink:0;margin:0 2px;}
.tb-spacer{flex:1;}

/* zoom control group */
.tb-zoom-group{display:flex;align-items:center;gap:4px;background:var(--surface-container-low);padding:4px 8px;border-radius:8px;}
.tb-zoom-group .ms{font-size:16px;color:var(--text-muted);cursor:pointer;padding:2px;border-radius:4px;}
.tb-zoom-group .ms:hover{color:var(--text-primary);background:var(--surface-container);}
#zoom-range{width:60px;accent-color:var(--primary);cursor:pointer;}
#zoom-val{font-size:.72rem;font-weight:700;color:var(--primary);min-width:34px;text-align:center;}

/* template picker */
#tpl-picker{display:flex;align-items:center;gap:6px;background:var(--surface-container-low);padding:4px 8px;border-radius:8px;}
#tpl-picker label{font-size:.68rem;font-weight:600;color:var(--text-muted);white-space:nowrap;}
#tpl-select{font-size:.75rem;font-family:inherit;color:var(--text-primary);font-weight:600;background:transparent;border:none;cursor:pointer;outline:none;padding:0 2px;}

/* topbar action buttons */
.tb-btn{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:7px;font-size:.75rem;font-weight:600;cursor:pointer;border:none;transition:all .15s;white-space:nowrap;font-family:inherit;}
.tb-btn .ms{font-size:16px;}
.tb-btn-ghost{background:transparent;color:var(--text-muted);}
.tb-btn-ghost:hover{background:var(--surface-container-low);color:var(--text-primary);}
.tb-btn-outline{background:var(--surface-sheet);color:var(--text-primary);box-shadow:0 1px 8px rgba(0,0,0,.04);border:1px solid var(--border-subtle);}
.tb-btn-outline:hover{background:var(--surface-container-low);}
.tb-btn-primary{background:var(--primary-container);color:var(--on-primary);box-shadow:0 1px 8px rgba(0,0,0,.06);}
.tb-btn-primary:hover{background:var(--accent-focus);}

/* ── APP LAYOUT ── */
#app{display:flex;flex:1;overflow:hidden;height:calc(100vh - var(--topbar-h));}

/* ── SIDEBAR ── */
#sidebar{
  width:var(--sw);flex-shrink:0;
  background:var(--sidebar-bg);
  border-right:1px solid var(--border-subtle);
  display:flex;flex-direction:column;overflow:hidden;
  box-shadow:0 1px 8px rgba(0,0,0,.04);
}
#sidebar-tabs{padding:8px 10px 0;background:var(--surface-sheet);}
.tabs-inner{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;background:var(--surface-container-low);padding:3px;border-radius:10px;}
.s-tab{
  display:flex;align-items:center;justify-content:center;gap:5px;
  padding:6px 4px;border-radius:7px;
  font-size:.72rem;font-weight:600;color:var(--text-muted);
  cursor:pointer;border:none;background:transparent;
  transition:all .15s;white-space:nowrap;font-family:inherit;
}
.s-tab .ms{font-size:14px;}
.s-tab.active{background:var(--surface-sheet);color:var(--text-primary);box-shadow:0 1px 6px rgba(0,0,0,.06);}
.s-tab:not(.active):hover{color:var(--text-primary);}

#sidebar-body{flex:1;overflow-y:auto;padding:10px;}

/* section list */
.sec-list-header{display:flex;align-items:center;justify-content:space-between;padding:4px 2px 8px;}
.sec-list-header span{font-size:.65rem;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.6px;}
.section-list{display:flex;flex-direction:column;gap:5px;}
.section-item{
  display:flex;align-items:center;gap:8px;
  padding:8px 10px;border-radius:9px;
  background:var(--surface-sheet);
  box-shadow:0 1px 4px rgba(15,23,42,.05);
  cursor:grab;user-select:none;
  transition:box-shadow .15s,background .15s;
}
.section-item:hover{background:var(--surface-container-low);box-shadow:0 2px 10px rgba(15,23,42,.07);}
.section-item.dragging{opacity:.4;}
.drag-handle{color:var(--text-muted);display:flex;align-items:center;flex-shrink:0;}
.drag-handle .ms{font-size:16px;}
.si-icon{width:26px;height:26px;border-radius:6px;background:var(--surface-container-high);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.si-icon .ms{font-size:14px;color:var(--primary);}
.si-text{flex:1;min-width:0;}
.section-name{font-size:.78rem;font-weight:600;color:var(--text-primary);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.si-sub{font-size:.65rem;color:var(--text-muted);display:block;}

/* new toggle — replaces old checkbox toggle */
.toggle-switch{position:relative;width:36px;height:20px;flex-shrink:0;}
.toggle-switch input{opacity:0;width:0;height:0;position:absolute;}
.toggle-track{position:absolute;inset:0;background:var(--border-strong);border-radius:20px;transition:.2s;cursor:pointer;}
.toggle-track::after{content:'';position:absolute;left:3px;top:3px;width:14px;height:14px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2);}
input:checked+.toggle-track{background:var(--primary-container);}
input:checked+.toggle-track::after{transform:translateX(16px);}

/* style panel */
.style-panel{display:flex;flex-direction:column;gap:14px;}
.sp-card{background:var(--surface-sheet);border-radius:10px;padding:12px;box-shadow:0 1px 4px rgba(15,23,42,.05);display:flex;flex-direction:column;gap:10px;}
.sp-card-title{display:flex;align-items:center;gap:6px;padding-bottom:8px;border-bottom:1px solid var(--border-subtle);}
.sp-card-title .ms{font-size:16px;color:var(--primary);}
.sp-card-title span{font-size:.75rem;font-weight:700;color:var(--text-primary);}
.sp-group{display:flex;flex-direction:column;gap:5px;}
.sp-group label{font-size:.65rem;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;}
.sp-group input[type=color]{width:100%;height:32px;border-radius:7px;border:1.5px solid var(--border-subtle);cursor:pointer;padding:2px;}
.sp-group select{width:100%;padding:6px 9px;border-radius:7px;border:1.5px solid var(--border-subtle);font-size:.78rem;font-family:inherit;background:var(--surface-sheet);color:var(--text-primary);}
.sp-group input[type=range]{width:100%;accent-color:var(--primary);cursor:pointer;}
.sp-row{display:flex;gap:8px;}
.sp-row .sp-group{flex:1;}
.sp-val{font-size:.7rem;font-weight:700;color:var(--primary);text-align:right;}
.color-presets{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px;}
.color-dot{width:22px;height:22px;border-radius:50%;cursor:pointer;border:2.5px solid transparent;transition:transform .15s,border-color .15s;box-shadow:0 1px 3px rgba(0,0,0,.15);}
.color-dot:hover{transform:scale(1.15);}
.color-dot.active{border-color:var(--text-primary);}
.sp-divider{height:1px;background:var(--border-subtle);}
.sp-toggle-row{display:flex;align-items:center;justify-content:space-between;}
.sp-toggle-row span{font-size:.78rem;color:var(--text-primary);font-weight:500;}

/* editor panel */
.editor-panel{display:flex;flex-direction:column;gap:8px;}
.field-group{display:flex;flex-direction:column;gap:5px;}
.field-group label{font-size:.65rem;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;}
.field-group input,.field-group textarea{padding:7px 9px;border-radius:7px;border:1.5px solid var(--border-subtle);font-size:.78rem;font-family:inherit;color:var(--text-primary);background:var(--surface-sheet);resize:vertical;line-height:1.5;transition:border-color .15s;}
.field-group input:focus,.field-group textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(0,74,198,.12);}
.list-item-row{display:flex;gap:5px;align-items:flex-start;}
.list-item-row input,.list-item-row textarea{flex:1;}
.btn-rm{background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:.9rem;padding:3px 5px;border-radius:5px;}
.btn-rm:hover{color:#dc2626;background:#fee2e2;}
.btn-add{background:var(--accent-soft);color:var(--primary);border:none;padding:5px 12px;border-radius:7px;font-size:.73rem;font-weight:700;cursor:pointer;font-family:inherit;}
.btn-add:hover{background:var(--primary-fixed);}
.subsection-card{border:1px solid var(--border-subtle);border-radius:9px;padding:10px;background:var(--surface-container-low);display:flex;flex-direction:column;gap:7px;}
.subsection-card .card-title{font-size:.75rem;font-weight:700;color:var(--text-primary);border-bottom:1px solid var(--border-subtle);padding-bottom:5px;display:flex;justify-content:space-between;align-items:center;}

/* ── MAIN CANVAS ── */
#main{flex:1;overflow:auto;background:var(--canvas-bg);}
#main-inner{
  display:flex;flex-direction:column;align-items:center;
  padding:24px 20px 80px;
  min-height:100%;
}
#canvas-hud{
  width:794px;max-width:100%;
  display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;
  margin-bottom:16px;
  background:rgba(255,255,255,.92);
  backdrop-filter:blur(12px);
  border-radius:12px;
  padding:8px 12px;
  box-shadow:0 4px 20px rgba(15,23,42,.07);
  border:1px solid var(--border-subtle);
}
.hud-left{display:flex;align-items:center;gap:8px;}
.hud-right{display:flex;align-items:center;gap:8px;}
.hud-page-info{display:flex;align-items:center;gap:5px;background:var(--surface-container-low);border-radius:7px;padding:4px 10px;}
.hud-page-info span{font-size:.72rem;font-weight:600;color:var(--text-primary);}
.hud-page-info .pg-cur{color:var(--primary);font-weight:700;}
.hud-page-info .pg-sep{color:var(--text-muted);}
.hud-ats{display:flex;align-items:center;gap:5px;padding:4px 10px;border-radius:7px;background:var(--surface-container-low);}
.hud-ats-dot{width:7px;height:7px;border-radius:50%;background:var(--success);}
.hud-ats span{font-size:.68rem;font-weight:600;color:var(--text-muted);}
.hud-btn{display:inline-flex;align-items:center;gap:4px;padding:5px 10px;border-radius:7px;font-size:.72rem;font-weight:600;cursor:pointer;border:none;font-family:inherit;transition:all .15s;}
.hud-btn .ms{font-size:15px;}
.hud-btn-ghost{background:var(--surface-container-low);color:var(--text-primary);}
.hud-btn-ghost:hover{background:var(--surface-container);}
.hud-btn-primary{background:var(--primary-container);color:var(--on-primary);box-shadow:0 1px 6px rgba(0,0,0,.08);}
.hud-btn-primary:hover{background:var(--accent-focus);}

/* preview wrapper */
#preview-wrapper{
  display:flex;flex-direction:column;align-items:center;gap:0;
  transform-origin:top center;
  transition:transform .2s;
}

/* page visual */
.resume-page{
  width:210mm;height:297mm;background:#fff;
  box-shadow:0 4px 28px rgba(0,0,0,.28);
  overflow:hidden;position:relative;flex-shrink:0;
}
.r-page-num{
  position:absolute;bottom:4mm;left:0;right:0;
  text-align:center;font-size:7.5pt;color:#aaa;
  pointer-events:none;user-select:none;
}
.page-gap{
  width:210mm;height:24px;background:transparent;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
}
.page-gap-label{
  font-size:.6rem;font-weight:700;
  color:rgba(255,255,255,.5);
  letter-spacing:.8px;text-transform:uppercase;
  background:rgba(15,23,42,.3);padding:2px 12px;border-radius:20px;
  pointer-events:none;user-select:none;
}
.page-count-footer{
  margin-top:10px;font-size:.63rem;color:rgba(255,255,255,.35);
  font-weight:600;letter-spacing:.5px;user-select:none;flex-shrink:0;
}

/* RESUME TYPOGRAPHY (shared across templates) */
/* font-family, font-size, line-height are set dynamically via resumeCSS()
   injected inside each .resume-page — do NOT hardcode them here */
.r-page-inner{
  width:210mm;
  color:#111;
}
.r-name{font-size:22pt;font-weight:700;letter-spacing:-.5px;line-height:1.1;}
.r-contact{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:6px;font-size:8.5pt;color:#555;}
.r-contact span{display:flex;align-items:center;gap:3px;}
.r-contact a{color:inherit;text-decoration:none;}
.r-divider{height:2px;margin:8px 0;}
.r-summary{font-size:9.5pt;color:#333;margin-bottom:10px;text-align:justify;line-height:1.5;}
/* CRITICAL: never split a section across pages */
.r-section{
  margin-bottom:10px;
  page-break-inside:avoid;
  break-inside:avoid;
}
.r-section-title{
  font-size:10.5pt;font-weight:700;text-transform:uppercase;
  letter-spacing:1.5px;padding-bottom:2px;margin-bottom:7px;
  page-break-after:avoid;break-after:avoid;
}
.r-entry{
  margin-bottom:8px;
  page-break-inside:avoid;
  break-inside:avoid;
}
.r-entry-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;}
.r-entry-title{font-weight:700;font-size:9.5pt;color:#111;page-break-after:avoid;break-after:avoid;}
.r-entry-date{font-size:8.5pt;color:#666;white-space:nowrap;flex-shrink:0;}
.r-entry-sub{font-size:9pt;color:#444;margin-top:1px;}
.r-entry-desc{font-size:9pt;color:#555;font-style:italic;margin-top:1px;}
.r-entry ul{margin:4px 0 0 0;padding-left:16px;list-style-position:outside;}
.r-entry li{font-size:9pt;color:#333;margin-bottom:2px;line-height:1.45;page-break-inside:avoid;break-inside:avoid;break-after:avoid;}
.r-section ul{margin:4px 0 0 0;padding-left:16px;list-style-position:outside;}
.r-section li{font-size:9pt;color:#333;margin-bottom:2px;line-height:1.45;page-break-inside:avoid;break-inside:avoid;break-after:avoid;}
.r-skills-grid{display:flex;flex-wrap:wrap;gap:4px;}
.r-skill-tag{border-radius:4px;padding:2px 8px;font-size:8pt;font-weight:600;}
.r-info-list{display:flex;flex-direction:column;gap:3px;}
.r-info-row{display:flex;gap:6px;font-size:8.5pt;}
.r-info-label{color:#888;font-weight:600;min-width:80px;flex-shrink:0;}
.r-info-val{color:#333;}
.r-lang-list{display:flex;flex-direction:column;gap:4px;}
.r-lang-row{display:flex;align-items:center;justify-content:space-between;font-size:8.5pt;}
.r-lang-name{color:#333;font-weight:600;}
.r-courses-grid{display:flex;flex-direction:column;gap:3px;}
.r-course-row{display:flex;justify-content:space-between;gap:8px;font-size:8.5pt;}
.r-course-name{color:#333;flex:1;}
.r-course-date{color:#888;white-space:nowrap;flex-shrink:0;}

/* two-column template */
.tc-wrap{display:flex;min-height:297mm;}
.tc-left{width:68mm;padding:14mm 7mm;flex-shrink:0;}
.tc-right{flex:1;padding:14mm 14mm 14mm 10mm;}
.tc-section-title{font-size:9pt;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;border-bottom:1px solid rgba(255,255,255,.4);padding-bottom:3px;margin:10px 0 6px;color:#fff;}
.tc-info-row{font-size:7.5pt;color:rgba(255,255,255,.85);margin-bottom:3px;}
.tc-info-label{font-weight:700;display:block;color:rgba(255,255,255,.6);}

/* ── PRINT ── */
@media print{
  @page{margin:15mm;}
  body{background:#fff;}
  #topbar,#sidebar,#canvas-hud{display:none!important;}
  #main{padding:0;background:#fff;}
  #preview-wrapper{transform:none!important;}
  .resume-page{box-shadow:none;height:auto;min-height:297mm;}
  .page-gap,.page-gap-label,.page-count-footer{display:none!important;}
  /* Prevent content splitting across pages */
  li, ul, .r-section, .r-entry, .tc-wrap, .tc-left, .tc-right{
    page-break-inside:avoid!important;
    break-inside:avoid!important;
  }
  /* Prevent orphaned headers */
  h1, h2, h3, h4, .r-name, .r-section-title, .r-entry-title, .tc-section-title{
    page-break-after:avoid!important;
    break-after:avoid!important;
  }
}

/* ── SCROLLBAR ── */
::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:3px;}

/* ── NOTIFICATION ── */
#notif{
  position:fixed;bottom:24px;right:24px;z-index:999;
  background:var(--inverse-surface);color:#fff;
  padding:10px 18px;border-radius:10px;
  font-size:.78rem;font-weight:600;
  opacity:0;pointer-events:none;transition:opacity .3s;
  box-shadow:0 6px 20px rgba(0,0,0,.25);
  display:flex;align-items:center;gap:8px;
}
#notif::before{content:'✓';font-size:.8rem;opacity:.7;}
#notif.show{opacity:1;}

/* ── PDF LOADING ── */
#pdf-loading{display:none;position:fixed;inset:0;z-index:200;background:rgba(15,23,42,.6);align-items:center;justify-content:center;flex-direction:column;gap:14px;backdrop-filter:blur(4px);}
#pdf-loading.show{display:flex;}
.pdf-spinner{width:44px;height:44px;border:3px solid rgba(255,255,255,.2);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
#pdf-loading p{color:#fff;font-size:.85rem;font-weight:600;}
</style>
</head>
<body>

<!-- ══ TOPBAR ══ -->
<div id="topbar">
  <!-- Brand -->
  <div class="tb-brand">
    <div class="tb-brand-icon"><span class="ms">description</span></div>
    <span class="tb-brand-name">ResumeEditor</span>
  </div>
  <div class="tb-sep"></div>
  <!-- Doc name + autosave -->
  <div class="tb-doc">
    <span class="tb-doc-name">Ronald Sebastian – CV</span>
    <div class="tb-autosave">
      <div class="tb-autosave-dot"></div>
      <span>Auto-saved</span>
    </div>
  </div>
  <div class="tb-sep"></div>
  <!-- Template picker -->
  <div id="tpl-picker">
    <label>Layout</label>
    <select id="tpl-select">
      <option value="classic">Classic</option>
      <option value="modern">Modern</option>
      <option value="executive">Executive</option>
      <option value="minimal">Minimal</option>
      <option value="twocol">Two-Column</option>
      <option value="compact">Compact Pro</option>

          <div class="r-entry-sub">${x(exp.company)}${exp.location?' · '+x(exp.location):''}</div>`;

// ─────────────────────────────────────────────────────────────
// PAGE-AWARE RENDER ENGINE
//
// Strategy:
//   1. Render ALL blocks into a hidden off-screen container
//      to measure their real pixel heights.
//   2. Walk through blocks, accumulating height.
//      When adding a block would overflow the current page,
//      start a new page — never split a block.
//   3. Each "block" = header OR one section element.
//   4. The visible preview shows physical page boxes with a
//      gap label between them (gap div is preview-only).
//   5. The PDF clone is a single continuous <div> with
//      page-break-inside:avoid on each block — jsPDF handles
//      the page breaking cleanly with no UI labels.
// ─────────────────────────────────────────────────────────────

const MM_PX = 3.7795275591; // 1mm = 3.7795… px at 96 dpi

function mmToPx(mm){ return mm * MM_PX; }

function makeHiddenStage(){
  // Off-screen container at exact 210mm width
  const stage = document.createElement('div');
  stage.style.cssText = `
    position:fixed;left:-9999px;top:0;
    width:210mm;visibility:hidden;pointer-events:none;z-index:-1;
  `;
  const st = document.createElement('style');
  st.textContent = resumeCSS();
  stage.appendChild(st);
  return stage;
}

/**
 * Build an array of {el, html} blocks for the current template.
 * Each block is a self-contained DOM node whose height we'll measure.
 */
function buildBlocks(tplKey){
  const tpl = TEMPLATES[tplKey] || TEMPLATES.classic;
  const hex = ST.accent;
  const blocks = [];

  // --- Two-column is special: one big block (no splittable sections)
  if(tplKey === 'twocol'){
    const rightSections = ['summary','experience','education','internships','courses','organizations'];
    let rightHtml = '';
    sectionOrder.forEach(k => {
      if(!sectionVis[k]) return;
      if(!rightSections.includes(k)) return;
      rightHtml += buildSectionHtml(k, tplKey);
    });
    const wrapper = tpl.wrapContent(rightHtml, data, hex, rgba(hex,.12), rgba(hex,.4), ST.marginV, ST.marginH, buildTwoColLeft);
    const el = document.createElement('div');
    el.className = 'r-page-inner';
    el.style.padding = '0'; // tc-wrap handles its own padding
    el.innerHTML = wrapper;
    blocks.push(el);
    return blocks;
  }

  // --- Single-column templates ---
  // Header block
  let headerHtml = tpl.headerHtml(data, hex);
  // Executive: replace placeholder vars
  headerHtml = headerHtml.replace(/VAR_MVmm/g, ST.marginV+'mm').replace(/VAR_MHmm/g, ST.marginH+'mm');
  const headerEl = document.createElement('div');
  headerEl.innerHTML = headerHtml;
  blocks.push(headerEl);

  // Section blocks
  sectionOrder.forEach(key => {
    if(!sectionVis[key]) return;
    const html = buildSectionHtml(key, tplKey);
    if(!html) return;
    const el = document.createElement('div');
    el.innerHTML = html;
    blocks.push(el);
  });

  return blocks;
}

/**
 * Measure heights of all blocks in a hidden stage.
 * Returns array of px heights.
 */
function measureBlocks(blocks){
  const stage = makeHiddenStage();
  const wrapper = document.createElement('div');
  wrapper.className = 'r-page-inner';
  blocks.forEach(b => wrapper.appendChild(b.cloneNode(true)));
  stage.appendChild(wrapper);
  document.body.appendChild(stage);

  const heights = [];
  for(let i = 0; i < wrapper.children.length; i++){
    heights.push(wrapper.children[i].getBoundingClientRect().height);
  }
  document.body.removeChild(stage);
  return heights;
}

/**
 * Given blocks + heights, bin them into pages.
 * Returns array of arrays: pages[pageIndex] = [blockIndex, ...]
 */
function paginateBlocks(heights, tplKey){
  const pageH = mmToPx(297);
  const padV  = mmToPx(ST.marginV);
  const usable = pageH - 2 * padV;

  const pages = [[]];
  let used = 0;

  heights.forEach((h, i) => {
    // If a single block is taller than a page, still place it alone
    if(used + h > usable && pages[pages.length-1].length > 0){
      pages.push([]);
      used = 0;
    }
    pages[pages.length-1].push(i);
    used += h;
  });
  return pages;
}

/**
 * Main render: builds the visual preview (page boxes + gap labels)
 */
function renderPages(){
  const wrapper = document.getElementById('preview-wrapper');
  wrapper.innerHTML = '';

  const tplKey = currentTpl;
  const blocks = buildBlocks(tplKey);
  const heights = measureBlocks(blocks);
  const pages = paginateBlocks(heights, tplKey);
  const numPages = pages.length;
  const showNums = ST.showPageNums !== false;

  // Helper: create a page-number label element
  function makePageNum(pi){
    const el = document.createElement('div');
    el.className = 'r-page-num';
    el.textContent = numPages > 1 ? `${pi + 1} / ${numPages}` : '';
    return el;
  }

  // Two-column: render as a single page box
  if(tplKey === 'twocol'){
    const page = document.createElement('div');
    page.className = 'resume-page';
    page.style.height = 'auto';
    page.style.minHeight = '297mm';
    const st = document.createElement('style');
    st.textContent = resumeCSS();
    page.appendChild(st);
    const inner = blocks[0].cloneNode(true);
    page.appendChild(inner);
    if(showNums && numPages > 1) page.appendChild(makePageNum(0));
    wrapper.appendChild(page);
    setTimeout(()=>applyZoom(parseInt(zoomRange.value)),80);
    return;
  }

  // Single-column: render each page as a physical box
  for(let pi = 0; pi < numPages; pi++){
    const pageEl = document.createElement('div');
    pageEl.className = 'resume-page';

    const st = document.createElement('style');
    st.textContent = resumeCSS();
    pageEl.appendChild(st);

    const inner = document.createElement('div');
    inner.className = 'r-page-inner';
    // Reserve bottom space for page number if enabled and multi-page
    if(showNums && numPages > 1){
      inner.style.paddingBottom = `${ST.marginV + 5}mm`;
    }

    pages[pi].forEach(bi => {
      inner.appendChild(blocks[bi].cloneNode(true));
    });

    pageEl.appendChild(inner);

    // Page number — appended directly to page (absolute positioned)
    if(showNums && numPages > 1){
      pageEl.appendChild(makePageNum(pi));
    }

    wrapper.appendChild(pageEl);

    // Gap between pages (preview-only)
    if(pi < numPages - 1){
      const gap = document.createElement('div');
      gap.className = 'page-gap';
      const lbl = document.createElement('div');
      lbl.className = 'page-gap-label';
      lbl.textContent = `page ${pi+1} of ${numPages}`;
      gap.appendChild(lbl);
      wrapper.appendChild(gap);
    }
  }

  // Footer count label (preview-only)
  if(numPages > 1){
    const footer = document.createElement('div');
    footer.className = 'page-count-footer';
    footer.textContent = `${numPages} pages total`;
    wrapper.appendChild(footer);
  }

  // Update HUD page counter
  const hudCur = document.getElementById('hud-page-cur');
  const hudTot = document.getElementById('hud-page-tot');
  if(hudCur) hudCur.textContent = '1';
  if(hudTot) hudTot.textContent = String(numPages);

  setTimeout(()=>applyZoom(parseInt(zoomRange.value)), 80);
}

// ─────────────────────────────────────────────────────────────
// ZOOM  — scroll-safe implementation
// The wrapper is scaled from top-center. After scaling, its
// layout box still occupies the ORIGINAL size, so scroll works
// normally to the top. We just need to make sure #main-inner
// is tall enough to not clip the bottom of scaled content.
// ─────────────────────────────────────────────────────────────
const zoomRange = document.getElementById('zoom-range');
const zoomVal   = document.getElementById('zoom-val');
const previewWrapper = document.getElementById('preview-wrapper');

function applyZoom(v){
  const scale = v / 100;
  previewWrapper.style.transform = `scale(${scale})`;
  zoomVal.textContent = v + '%';
  const hudZV = document.getElementById('hud-zoom-val');
  if(hudZV) hudZV.textContent = v + '%';
  requestAnimationFrame(() => {
    const naturalH = previewWrapper.offsetHeight;
    const scaledH  = naturalH * scale;
    const mainInner = document.getElementById('main-inner');
    mainInner.style.minHeight = (scaledH + 88) + 'px';
  });
}
function zoomStep(delta){
  const r = document.getElementById('zoom-range');
  const v = Math.min(120, Math.max(35, parseInt(r.value) + delta));
  r.value = v;
  applyZoom(v);
}
function fitZoom(){
  const main = document.getElementById('main');
  const availW = main.clientWidth - 48;
  const pageW  = 794; // 210mm at 96dpi
  const fit    = Math.floor((availW / pageW) * 100);
  const v      = Math.min(120, Math.max(35, fit));
  const r      = document.getElementById('zoom-range');
  r.value = v;
  applyZoom(v);
}
zoomRange.addEventListener('input', () => applyZoom(parseInt(zoomRange.value)));

// ─────────────────────────────────────────────────────────────
// PDF EXPORT — pre-paginated print window (matches preview exactly)
// Each page is an explicit 210mm × 297mm div. The browser prints
// one div per page with no reflowing, no extra margins, no gaps.
// ─────────────────────────────────────────────────────────────
async function downloadPDF(){
  const loading = document.getElementById('pdf-loading');
  loading.classList.add('show');
  try{
    const tpl = TEMPLATES[currentTpl] || TEMPLATES.classic;
    const hex = ST.accent;

    // Build a clean, standalone container — NO page-gap labels, NO UI elements
    const container = document.createElement('div');
    container.style.cssText = 'width:210mm;';

    const st = document.createElement('style');
    st.textContent = resumeCSS() + `
      /* Extra PDF safety */
      .r-section{page-break-inside:avoid!important;break-inside:avoid!important;}
      .r-entry{page-break-inside:avoid!important;break-inside:avoid!important;}
      .r-section-title{page-break-after:avoid!important;break-after:avoid!important;}
      .r-page-inner{padding:${ST.marginV}mm ${ST.marginH}mm;}
    `;
    container.appendChild(st);

    if(currentTpl === 'twocol'){
      const rightSections = ['summary','experience','education','internships','courses','organizations'];
      let rightHtml = '';
      sectionOrder.forEach(k => {
        if(!sectionVis[k]) return;
        if(!rightSections.includes(k)) return;
        rightHtml += buildSectionHtml(k, 'twocol');
      });
      const content = document.createElement('div');
      content.innerHTML = tpl.wrapContent(rightHtml, data, hex, rgba(hex,.12), rgba(hex,.4), ST.marginV, ST.marginH, buildTwoColLeft);
      container.appendChild(content);
    } else {
      const content = document.createElement('div');
      content.className = 'r-page-inner';
      // Header
      let hHtml = tpl.headerHtml(data, hex);
      hHtml = hHtml.replace(/VAR_MVmm/g, ST.marginV+'mm').replace(/VAR_MHmm/g, ST.marginH+'mm');
      content.innerHTML = hHtml;
      // Sections
      sectionOrder.forEach(key => {
        if(!sectionVis[key]) return;
        const html = buildSectionHtml(key, currentTpl);
        if(!html) return;
        const el = document.createElement('div');
        el.style.cssText = 'page-break-inside:avoid;break-inside:avoid;';
        el.innerHTML = html;
        content.appendChild(el);
      });
      container.appendChild(content);
    }

    await html2pdf().set({
      margin: 0,
      filename: 'Ronald_Sebastian_Resume.pdf',
      image: { type: 'jpeg', quality: 1 },
      html2canvas: { scale: 3, useCORS: true, letterRendering: true },
      jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait', compress: true },
      pagebreak: { mode: ['avoid-all', 'css', 'legacy'], before: '.page-break-before', avoid: ['.r-section','.r-entry'] }
    }).from(container).save();

    notify('PDF downloaded!');
  } catch(err){
    console.error(err);
    notify('Error generating PDF — check console.');
  } finally {
    loading.classList.remove('show');
  }
}

// ─────────────────────────────────────────────────────────────
// SECTION LIST (drag & toggle)
// ─────────────────────────────────────────────────────────────
function renderSectionList(){
  const list = document.getElementById('section-list');
  list.innerHTML = '';
  sectionOrder.forEach(key=>{
    const meta = SECTION_META.find(m=>m.key===key);
    if(!meta) return;
    const item = document.createElement('div');
    item.className = 'section-item';
    item.draggable = true;
    item.dataset.key = key;
    item.innerHTML = `
      <span class="drag-handle"><span class="ms">drag_indicator</span></span>
      <div class="si-icon"><span class="ms">${meta.msIcon}</span></div>
      <div class="si-text">
        <span class="section-name">${meta.label}</span>
        <span class="si-sub">${meta.sub}</span>
      </div>
      <label class="toggle-switch">
        <input type="checkbox" ${sectionVis[key]?'checked':''} data-key="${key}"/>
        <span class="toggle-track"></span>
      </label>`;
    item.querySelector('input').addEventListener('change', ev=>{
      sectionVis[ev.target.dataset.key] = ev.target.checked;
      renderPages(); persist();
    });
    list.appendChild(item);
  });
  initDrag();
}
let dragSrc = null;
function initDrag(){
  document.querySelectorAll('.section-item').forEach(item=>{
    item.addEventListener('dragstart', e=>{ dragSrc=item; item.classList.add('dragging'); e.dataTransfer.effectAllowed='move'; });
    item.addEventListener('dragend',   ()=>{ item.classList.remove('dragging'); dragSrc=null; });
    item.addEventListener('dragover',  e=>{ e.preventDefault();
      if(dragSrc&&dragSrc!==item){ const p=item.parentNode,arr=[...p.children],si=arr.indexOf(dragSrc),ti=arr.indexOf(item);
        if(si<ti) p.insertBefore(dragSrc,item.nextSibling); else p.insertBefore(dragSrc,item); }
    });
    item.addEventListener('drop', ()=>{ sectionOrder=[...document.querySelectorAll('.section-item')].map(i=>i.dataset.key); renderPages(); persist(); });
  });
}

// ─────────────────────────────────────────────────────────────
// STYLE PANEL
// ─────────────────────────────────────────────────────────────
function initStylePanel(){
  const presets = document.getElementById('color-presets');
  COLOR_PRESETS.forEach(c=>{
    const dot = document.createElement('div');
    dot.className = 'color-dot' + (c===ST.accent?' active':'');
    dot.style.background = c; dot.title = c;
    dot.addEventListener('click', ()=>{
      ST.accent=c; document.getElementById('color-picker').value=c;
      document.querySelectorAll('.color-dot').forEach(d=>d.classList.remove('active'));
      dot.classList.add('active'); renderPages(); persist();
    });
    presets.appendChild(dot);
  });
  document.getElementById('color-picker').value  = ST.accent;
  document.getElementById('font-select').value   = ST.font;

  // Range sliders — sync value labels on load
  function syncSlider(id, labelId, suffix){
    const el = document.getElementById(id);
    const lbl = document.getElementById(labelId);
    if(el && lbl) lbl.textContent = el.value + (suffix||'');
    el && el.addEventListener('input', ()=>{
      if(lbl) lbl.textContent = el.value + (suffix||'');
    });
  }
  // Set slider values from ST state
  document.getElementById('font-size').value   = ST.fontSize;
  document.getElementById('line-height').value = ST.lineHeight;
  document.getElementById('margin-v').value    = ST.marginV;
  document.getElementById('margin-h').value    = ST.marginH;

  syncSlider('font-size',   'font-size-val',   ' pt');
  syncSlider('line-height', 'line-height-val',  '');
  syncSlider('margin-v',    'margin-v-val',    ' mm');
  syncSlider('margin-h',    'margin-h-val',    ' mm');

  document.getElementById('color-picker').addEventListener('input', e=>{
    ST.accent=e.target.value;
    document.querySelectorAll('.color-dot').forEach(d=>d.classList.remove('active'));
    renderPages(); persist();
  });

  const FONT_LH = {
    "'Times New Roman',Times,serif": 1.45,
    "Georgia,serif":                 1.45,
    "Arial,Helvetica,sans-serif":    1.30,
    "Calibri,sans-serif":            1.30,
    "'Trebuchet MS',sans-serif":     1.32,
  };
  let _lastAutoLH = FONT_LH[ST.font] || 1.45;

  document.getElementById('font-select').addEventListener('change', ()=>{
    ST.font = document.getElementById('font-select').value;
    const currentLH = parseFloat(document.getElementById('line-height').value);
    const autoLH    = FONT_LH[ST.font] || 1.40;
    if(Math.abs(currentLH - _lastAutoLH) < 0.01){
      ST.lineHeight = autoLH;
      document.getElementById('line-height').value = autoLH;
      const lbl = document.getElementById('line-height-val');
      if(lbl) lbl.textContent = autoLH;
      _lastAutoLH = autoLH;
    } else {
      ST.lineHeight = currentLH;
    }
    renderPages(); persist();
  });

  ['font-size','line-height','margin-v','margin-h'].forEach(id=>{
    document.getElementById(id).addEventListener('change', ()=>{
      ST.fontSize   = parseFloat(document.getElementById('font-size').value);
      ST.lineHeight = parseFloat(document.getElementById('line-height').value);
      ST.marginV    = parseFloat(document.getElementById('margin-v').value);
      ST.marginH    = parseFloat(document.getElementById('margin-h').value);
      renderPages(); persist();
    });
  });
  // Also trigger on input (range fires 'input' not 'change' while dragging)
  ['font-size','line-height','margin-v','margin-h'].forEach(id=>{
    document.getElementById(id).addEventListener('input', ()=>{
      ST.fontSize   = parseFloat(document.getElementById('font-size').value);
      ST.lineHeight = parseFloat(document.getElementById('line-height').value);
      ST.marginV    = parseFloat(document.getElementById('margin-v').value);
      ST.marginH    = parseFloat(document.getElementById('margin-h').value);
      renderPages(); persist();
    });
  });
}

function renderEditorPanel(){

  panel.innerHTML = '';
  panel.appendChild(mkSec('Header / Contact',     buildHeaderEd()));
  panel.appendChild(mkSec('Professional Summary', buildSummaryEd()));
  panel.appendChild(mkSec('Work Experience',      buildExpEd()));
  panel.appendChild(mkSec('Education',            buildEduEd()));
  panel.appendChild(mkSec('Internships',          buildInternEd()));
  panel.appendChild(mkSec('Skills',               buildSkillsEd()));
  panel.appendChild(mkSec('Languages',            buildLangsEd()));
  panel.appendChild(mkSec('Courses & Certs',      buildCoursesEd()));

}
function mkSec(title, content){
  const w=document.createElement('div');
  w.style.cssText='border:1px solid var(--border-subtle);border-radius:10px;overflow:hidden;';
  const h=document.createElement('div');
  h.style.cssText='padding:9px 12px;background:var(--surface-container-low);font-size:.76rem;font-weight:700;color:var(--text-primary);cursor:pointer;display:flex;justify-content:space-between;align-items:center;';
  h.innerHTML=`<span>${title}</span><span style="color:var(--text-muted);font-size:.8rem;">▾</span>`;
  const b=document.createElement('div');
  b.style.cssText='padding:11px;display:flex;flex-direction:column;gap:7px;background:var(--surface-sheet);';
  b.appendChild(content);
  h.addEventListener('click',()=>{ b.style.display=b.style.display==='none'?'flex':'none'; h.querySelector('span:last-child').textContent=b.style.display==='none'?'▸':'▾'; });
  w.appendChild(h); w.appendChild(b); return w;
}
function fld(label,val,cb,rows=1){
  const g=document.createElement('div'); g.className='field-group';
  const l=document.createElement('label'); l.textContent=label;
  let inp;
  if(rows>1){ inp=document.createElement('textarea'); inp.rows=rows; inp.style.minHeight=(rows*20+12)+'px'; }
  else { inp=document.createElement('input'); inp.type='text'; }
  inp.value=val||'';
  inp.addEventListener('input',()=>{ cb(inp.value); renderPages(); persist(); });
  g.appendChild(l); g.appendChild(inp); return g;
}
function buildHeaderEd(){
  const f=document.createDocumentFragment(), h=data.header;
  [['Full Name','name'],['Location','location'],['Email','email'],['Phone','phone'],['LinkedIn URL','linkedin'],['Portfolio URL','github'],['Instagram URL','instagram']].forEach(([l,k])=>f.appendChild(fld(l,h[k],v=>h[k]=v)));
  return f;
}
function buildSummaryEd(){ return fld('Summary',data.summary,v=>data.summary=v,5); }
function buildExpEd(){
  const w=document.createElement('div'); w.style.cssText='display:flex;flex-direction:column;gap:9px;';
  function render(){
    w.innerHTML='';
    data.experience.forEach((exp,i)=>{
      const card=document.createElement('div'); card.className='subsection-card';
      const title=document.createElement('div'); title.className='card-title';
      title.innerHTML=`<span>#${i+1} ${exp.title||'Entry'}</span>`;
      const rm=document.createElement('button'); rm.className='btn-rm'; rm.textContent='✕';
      rm.addEventListener('click',()=>{ data.experience.splice(i,1); render(); renderPages(); persist(); });
      title.appendChild(rm); card.appendChild(title);
      [['Job Title','title'],['Company','company'],['Location','location'],['Date Range','date']].forEach(([l,k])=>card.appendChild(fld(l,exp[k],v=>exp[k]=v)));
      const bw=document.createElement('div'); bw.style.cssText='display:flex;flex-direction:column;gap:4px;';
      const bl=document.createElement('label'); bl.className='field-group'; bl.innerHTML='<label>Bullet Points</label>'; bw.appendChild(bl);
      function renderB(){
        bw.querySelectorAll('.list-item-row').forEach(el=>el.remove());
        const existAb=bw.querySelector('.btn-add'); if(existAb)existAb.remove();
        exp.bullets.forEach((b,bi)=>{
          const row=document.createElement('div'); row.className='list-item-row';
          const ta=document.createElement('textarea'); ta.rows=2; ta.style.fontSize='.78rem'; ta.value=b;
          ta.addEventListener('input',()=>{ exp.bullets[bi]=ta.value; renderPages(); persist(); });
          const r2=document.createElement('button'); r2.className='btn-rm'; r2.textContent='✕';
          r2.addEventListener('click',()=>{ exp.bullets.splice(bi,1); renderB(); renderPages(); persist(); });
          row.appendChild(ta); row.appendChild(r2); bw.appendChild(row);
        });
        const a=document.createElement('button'); a.className='btn-add'; a.textContent='+ Bullet';
        a.addEventListener('click',()=>{ exp.bullets.push(''); renderB(); renderPages(); persist(); });
        bw.appendChild(a);
      }
      renderB(); card.appendChild(bw); w.appendChild(card);
    });
    const a=document.createElement('button'); a.className='btn-add'; a.textContent='+ Add Experience';
    a.addEventListener('click',()=>{ data.experience.push({title:'',company:'',location:'',date:'',bullets:[]}); render(); renderPages(); persist(); });
    w.appendChild(a);
  }
  render(); return w;
}

function buildSkillsEd(){
  const w=document.createElement('div'); w.style.cssText='display:flex;flex-direction:column;gap:6px;';
  function render(){
    w.innerHTML='';
    const grid=document.createElement('div'); grid.style.cssText='display:flex;flex-wrap:wrap;gap:5px;';
    data.skills.forEach((sk,i)=>{
      const tag=document.createElement('div'); tag.style.cssText='display:flex;align-items:center;gap:3px;background:var(--accent-light);border-radius:5px;padding:3px 7px;font-size:.76rem;';
      tag.innerHTML=`<span>${sk}</span>`;
      const rm=document.createElement('button'); rm.className='btn-rm'; rm.style.cssText='padding:0;font-size:.8rem;'; rm.textContent='✕';
      rm.addEventListener('click',()=>{ data.skills.splice(i,1); render(); renderPages(); persist(); });
      tag.appendChild(rm); grid.appendChild(tag);
    });
    w.appendChild(grid);
    const row=document.createElement('div'); row.style.cssText='display:flex;gap:5px;margin-top:3px;';
    const inp=document.createElement('input'); inp.placeholder='Add skill…'; inp.style.cssText='flex:1;padding:6px 9px;border-radius:6px;border:1px solid var(--g300);font-size:.78rem;';
    const ab=document.createElement('button'); ab.className='btn-add'; ab.textContent='+ Add';
    ab.addEventListener('click',()=>{ if(inp.value.trim()){ data.skills.push(inp.value.trim()); inp.value=''; render(); renderPages(); persist(); } });
    inp.addEventListener('keydown', e=>{ if(e.key==='Enter') ab.click(); });
    row.appendChild(inp); row.appendChild(ab); w.appendChild(row);
  }
  render(); return w;
}
function buildLangsEd(){
  const LEVELS = ['Native','Fluent','Advanced','Upper-Intermediate','Intermediate','Elementary','Beginner'];
  const w=document.createElement('div'); w.style.cssText='display:flex;flex-direction:column;gap:5px;';
  function render(){
    w.innerHTML='';
    data.languages.forEach((lang,i)=>{
      const row=document.createElement('div'); row.style.cssText='display:flex;gap:5px;align-items:center;';
      const ni=document.createElement('input'); ni.value=lang.name; ni.placeholder='Language'; ni.style.cssText='flex:1;padding:5px 8px;border-radius:6px;border:1px solid var(--g300);font-size:.78rem;';
      ni.addEventListener('input',()=>{ lang.name=ni.value; renderPages(); persist(); });
      const sel=document.createElement('select'); sel.style.cssText='width:130px;padding:5px 7px;border-radius:6px;border:1px solid var(--g300);font-size:.75rem;font-family:var(--ui);background:#fff;color:var(--g800);';
      LEVELS.forEach(lv=>{ const opt=document.createElement('option'); opt.value=lv; opt.textContent=lv; if((lang.proficiency||'')===lv) opt.selected=true; sel.appendChild(opt); });
      sel.addEventListener('change',()=>{ lang.proficiency=sel.value; renderPages(); persist(); });
      const rm=document.createElement('button'); rm.className='btn-rm'; rm.textContent='✕';
      rm.addEventListener('click',()=>{ data.languages.splice(i,1); render(); renderPages(); persist(); });
      row.appendChild(ni); row.appendChild(sel); row.appendChild(rm); w.appendChild(row);
    });
    const a=document.createElement('button'); a.className='btn-add'; a.textContent='+ Add Language';
    a.addEventListener('click',()=>{ data.languages.push({name:'',proficiency:'Intermediate'}); render(); renderPages(); persist(); });
    w.appendChild(a);
  }
  render(); return w;
}

// ─────────────────────────────────────────────────────────────
// EXPORT / RESET
// ─────────────────────────────────────────────────────────────
function exportJSON(){
  const blob=new Blob([JSON.stringify({data,sectionOrder,sectionVis,ST,currentTpl},null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download='resume_data.json'; a.click(); URL.revokeObjectURL(url);
  notify('JSON exported!');
}
function resetData(){
  if(!confirm('Reset all changes to default?')) return;
  data        = JSON.parse(JSON.stringify(DEFAULT_DATA));
  sectionOrder= SECTION_META.map(s=>s.key);
  sectionVis  = Object.fromEntries(SECTION_META.map(s=>[s.key,true]));
  ST          = {accent:"#1a56db",font:"'Times New Roman',Times,serif",fontSize:10,lineHeight:1.45,marginV:14,marginH:16};
  currentTpl  = 'classic';
  localStorage.removeItem('resumeEditorV3');
  document.getElementById('tpl-select').value   = 'classic';
  document.getElementById('color-picker').value = ST.accent;
  document.getElementById('font-select').value  = ST.font;
  document.getElementById('font-size').value    = ST.fontSize;
  document.getElementById('line-height').value  = ST.lineHeight;
  document.getElementById('margin-v').value     = ST.marginV;
  document.getElementById('margin-h').value     = ST.marginH;
  // sync slider labels
  const lv = {
    'font-size-val':   ST.fontSize + ' pt',
    'line-height-val': ST.lineHeight + '',
    'margin-v-val':    ST.marginV + ' mm',
    'margin-h-val':    ST.marginH + ' mm',
  };
  Object.entries(lv).forEach(([id,v])=>{ const el=document.getElementById(id); if(el) el.textContent=v; });
  document.querySelectorAll('.color-dot').forEach(d=>d.classList.remove('active'));
  document.querySelector(`.color-dot[title="${ST.accent}"]`)?.classList.add('active');
  renderSectionList(); renderPages(); renderEditorPanel();
  notify('Reset to default!');
}
