<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --accent:#1a56db;--accent-dark:#1040b0;--accent-light:#e8f0fe;
  --g50:#f9fafb;--g100:#f3f4f6;--g200:#e5e7eb;--g300:#d1d5db;
  --g400:#9ca3af;--g500:#6b7280;--g600:#4b5563;--g700:#374151;--g800:#1f2937;
  --sw:340px;--ui:'Inter',system-ui,sans-serif;
}
html{font-size:14px;}
body{font-family:var(--ui);background:#b8bfc8;color:var(--g800);min-height:100vh;display:flex;flex-direction:column;}

/* TOPBAR */
#topbar{
  position:sticky;top:0;z-index:100;display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  background:#fff;border-bottom:1px solid var(--g200);padding:8px 16px;min-height:52px;
}
.logo{font-weight:700;font-size:.95rem;color:var(--accent);letter-spacing:-.3px;flex-shrink:0;}
.logo span{color:var(--g700);}
.tb-sep{width:1px;height:22px;background:var(--g200);flex-shrink:0;}
.tb-spacer{flex:1;}
.btn{display:inline-flex;align-items:center;gap:5px;padding:6px 12px;border-radius:7px;font-size:.78rem;font-weight:600;cursor:pointer;border:none;transition:all .15s;white-space:nowrap;}
.btn-primary{background:var(--accent);color:#fff;}
.btn-primary:hover{background:var(--accent-dark);}
.btn-outline{background:#fff;color:var(--g700);border:1.5px solid var(--g300);}
.btn-outline:hover{border-color:var(--accent);color:var(--accent);}
#zoom-ctrl{display:flex;align-items:center;gap:5px;}
#zoom-ctrl label{font-size:.75rem;color:var(--g600);}
#zoom-range{width:72px;accent-color:var(--accent);}
#zoom-val{font-size:.75rem;color:var(--accent);font-weight:700;width:30px;}
#tpl-picker{display:flex;align-items:center;gap:6px;}
#tpl-picker label{font-size:.75rem;font-weight:600;color:var(--g600);}
#tpl-select{padding:5px 8px;border-radius:7px;border:1.5px solid var(--g300);font-size:.78rem;font-family:var(--ui);color:var(--g800);cursor:pointer;background:#fff;}

/* APP LAYOUT */
#app{display:flex;flex:1;overflow:hidden;height:calc(100vh - 52px);}

/* SIDEBAR */
#sidebar{width:var(--sw);flex-shrink:0;background:#fff;border-right:1px solid var(--g200);display:flex;flex-direction:column;overflow:hidden;}
#sidebar-tabs{display:flex;border-bottom:1px solid var(--g200);}
.s-tab{flex:1;padding:9px 4px;text-align:center;font-size:.75rem;font-weight:600;color:var(--g600);cursor:pointer;border:none;background:transparent;border-bottom:2px solid transparent;transition:all .15s;}
.s-tab.active{color:var(--accent);border-bottom-color:var(--accent);}
#sidebar-body{flex:1;overflow-y:auto;padding:14px;}
.section-list{display:flex;flex-direction:column;gap:5px;}
.section-item{display:flex;align-items:center;gap:8px;padding:9px 11px;border-radius:7px;border:1px solid var(--g200);cursor:grab;user-select:none;background:#fff;transition:box-shadow .15s;}
.section-item:hover{box-shadow:0 2px 8px rgba(0,0,0,.07);}
.section-item.dragging{opacity:.4;}
.drag-handle{color:var(--g400);font-size:.9rem;}
.section-name{flex:1;font-size:.8rem;font-weight:600;color:var(--g700);}
.toggle-switch{position:relative;width:34px;height:19px;flex-shrink:0;}
.toggle-switch input{opacity:0;width:0;height:0;}
.toggle-track{position:absolute;inset:0;background:var(--g300);border-radius:20px;transition:.2s;cursor:pointer;}
.toggle-track::after{content:'';position:absolute;left:2px;top:2px;width:15px;height:15px;border-radius:50%;background:#fff;transition:.2s;}
input:checked+.toggle-track{background:var(--accent);}
input:checked+.toggle-track::after{transform:translateX(15px);}
.style-panel{display:flex;flex-direction:column;gap:13px;}
.sp-group label{display:block;font-size:.72rem;font-weight:700;color:var(--g600);margin-bottom:5px;text-transform:uppercase;letter-spacing:.5px;}
.sp-group input[type=color]{width:100%;height:30px;border-radius:6px;border:1px solid var(--g300);cursor:pointer;padding:2px;}
.sp-group select,.sp-group input[type=number]{width:100%;padding:6px 9px;border-radius:6px;border:1px solid var(--g300);font-size:.8rem;font-family:var(--ui);background:#fff;color:var(--g800);}
.sp-row{display:flex;gap:7px;}
.sp-row .sp-group{flex:1;}
.color-presets{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px;}
.color-dot{width:20px;height:20px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:transform .15s;}
.color-dot:hover{transform:scale(1.15);border-color:var(--g400);}
.color-dot.active{border-color:var(--g800);}
.sp-divider{height:1px;background:var(--g200);margin:2px 0;}
.editor-panel{display:flex;flex-direction:column;gap:10px;}
.field-group{display:flex;flex-direction:column;gap:5px;}
.field-group label{font-size:.72rem;font-weight:700;color:var(--g600);text-transform:uppercase;letter-spacing:.5px;}
.field-group input,.field-group textarea{padding:7px 9px;border-radius:6px;border:1px solid var(--g300);font-size:.8rem;font-family:var(--ui);color:var(--g800);background:#fff;resize:vertical;line-height:1.5;transition:border-color .15s;}
.field-group input:focus,.field-group textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-light);}
.list-item-row{display:flex;gap:5px;align-items:flex-start;}
.list-item-row input,.list-item-row textarea{flex:1;}
.btn-rm{background:none;border:none;color:var(--g400);cursor:pointer;font-size:1rem;padding:3px 5px;border-radius:4px;}
.btn-rm:hover{color:#dc2626;background:#fee2e2;}
.btn-add{background:var(--accent-light);color:var(--accent);border:none;padding:5px 11px;border-radius:6px;font-size:.76rem;font-weight:700;cursor:pointer;}
.btn-add:hover{background:#c7d7fd;}
.subsection-card{border:1px solid var(--g200);border-radius:8px;padding:10px;background:var(--g50);display:flex;flex-direction:column;gap:7px;}
.subsection-card .card-title{font-size:.77rem;font-weight:700;color:var(--g700);border-bottom:1px solid var(--g200);padding-bottom:5px;display:flex;justify-content:space-between;align-items:center;}

/* MAIN PREVIEW */
#main{flex:1;overflow:auto;background:#b8bfc8;}
/* Scroll-safe wrapper: preview-wrapper sits inside a flex centering shell.
   We never touch marginTop/marginBottom on preview-wrapper (that was the scroll bug).
   Instead we set an explicit height on the outer shell so the scrollable
   area always starts at the top. */
#main-inner{
  display:flex;flex-direction:column;align-items:center;
  padding:28px 20px 60px;
  /* min-height matches actual scaled content so scroll doesn't collapse */
  min-height:100%;
}
#preview-wrapper{
  display:flex;flex-direction:column;align-items:center;gap:0;
  transform-origin:top center;
  transition:transform .2s;
  /* We update this via JS to compensate scaled size */
}

/* PAGE VISUAL (preview only) */
.resume-page{
  width:210mm;min-height:297mm;background:#fff;
  box-shadow:0 4px 28px rgba(0,0,0,.28);
  position:relative;flex-shrink:0;overflow:visible;
}
/* Page number footer — sits at the bottom of each page */
.r-page-num{
  position:absolute;bottom:4mm;left:0;right:0;
  text-align:center;
  font-size:7.5pt;color:#aaa;
  pointer-events:none;user-select:none;
}
/* gap bar between pages — preview only, never in PDF */
.page-gap{
  width:210mm;height:20px;background:transparent;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
}
.page-gap-label{
  font-size:.6rem;font-weight:700;color:rgba(255,255,255,.45);
  letter-spacing:.8px;text-transform:uppercase;
  background:rgba(0,0,0,.25);padding:1px 10px;border-radius:10px;
  pointer-events:none;user-select:none;
}
.page-count-footer{
  margin-top:8px;font-size:.63rem;color:rgba(255,255,255,.38);
  font-weight:600;letter-spacing:.5px;user-select:none;flex-shrink:0;
}

/* RESUME TYPOGRAPHY (shared across templates) */
/* font-family, font-size, line-height are set dynamically via resumeCSS()
   injected inside each .resume-page — do NOT hardcode them here */
.r-page-inner{
  width:210mm;
  color:#111;
}
.r-name{font-size:22pt;font-weight:700;letter-spacing:-.5px;line-height:1.1;}
.r-contact{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:6px;font-size:8.5pt;color:#555;}
.r-contact span{display:flex;align-items:center;gap:3px;}
.r-contact a{color:inherit;text-decoration:none;}
.r-divider{height:2px;margin:8px 0;}
.r-summary{font-size:9.5pt;color:#333;margin-bottom:10px;text-align:justify;line-height:1.5;}
/* CRITICAL: never split a section across pages */
.r-section{
  margin-bottom:10px;
  page-break-inside:avoid;
  break-inside:avoid;
}
.r-section-title{
  font-size:10.5pt;font-weight:700;text-transform:uppercase;
  letter-spacing:1.5px;padding-bottom:2px;margin-bottom:7px;
  page-break-after:avoid;break-after:avoid;page-break-inside:avoid;break-inside:avoid;
}
.r-entry{
  margin-bottom:8px;
  page-break-inside:avoid;
  break-inside:avoid;
}
.r-entry-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;}
.r-entry-title{font-weight:700;font-size:9.5pt;color:#111;page-break-after:avoid;break-after:avoid;}
.r-entry-date{font-size:8.5pt;color:#666;white-space:nowrap;flex-shrink:0;}
.r-entry-sub{font-size:9pt;color:#444;margin-top:1px;}
.r-entry-desc{font-size:9pt;color:#555;font-style:italic;margin-top:1px;}
.r-entry ul{margin:4px 0 0 0;padding-left:16px;list-style-position:outside;}
.r-entry li{font-size:9pt;color:#333;margin-bottom:2px;line-height:1.45;page-break-inside:avoid;break-inside:avoid;break-after:avoid;}
.r-section ul{margin:4px 0 0 0;padding-left:16px;list-style-position:outside;}
.r-section li{font-size:9pt;color:#333;margin-bottom:2px;line-height:1.45;page-break-inside:avoid;break-inside:avoid;break-after:avoid;}
.r-skills-grid{display:flex;flex-wrap:wrap;gap:4px;}
.r-skill-tag{border-radius:4px;padding:2px 8px;font-size:8pt;font-weight:600;}
.r-info-list{display:flex;flex-direction:column;gap:3px;}
.r-info-row{display:flex;gap:6px;font-size:8.5pt;}
.r-info-label{color:#888;font-weight:600;min-width:80px;flex-shrink:0;}
.r-info-val{color:#333;}
.r-lang-list{display:flex;flex-direction:column;gap:4px;}
.r-lang-row{display:flex;align-items:center;justify-content:space-between;font-size:8.5pt;}
.r-lang-name{color:#333;font-weight:600;}
.r-courses-grid{display:flex;flex-direction:column;gap:3px;}
.r-course-row{display:flex;justify-content:space-between;gap:8px;font-size:8.5pt;}
.r-course-name{color:#333;flex:1;}
.r-course-date{color:#888;white-space:nowrap;flex-shrink:0;}

/* two-column template */
.tc-wrap{display:flex;min-height:297mm;break-inside:auto;}
.tc-left{width:68mm;padding:14mm 7mm;flex-shrink:0;break-inside:auto;}
.tc-right{flex:1;padding:14mm 14mm 14mm 10mm;break-inside:auto;}
.tc-section-title{font-size:9pt;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;border-bottom:1px solid rgba(255,255,255,.4);padding-bottom:3px;margin:10px 0 6px;color:#fff;}
.tc-info-row{font-size:7.5pt;color:rgba(255,255,255,.85);margin-bottom:3px;}
.tc-info-label{font-weight:700;display:block;color:rgba(255,255,255,.6);}

/* PRINT */
@media print{
  @page{margin:15mm;}
  body{background:#fff;}
  #topbar,#sidebar{display:none!important;}
  #main{padding:0;background:#fff;}
  #preview-wrapper{transform:none!important;}
  .resume-page{box-shadow:none;height:auto;min-height:297mm;}
  .page-gap,.page-gap-label,.page-count-footer{display:none!important;}
}

/* SCROLLBAR */
::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--g400);border-radius:3px;}

/* NOTIFICATION */
#notif{position:fixed;bottom:20px;right:20px;z-index:999;background:var(--g800);color:#fff;padding:9px 16px;border-radius:8px;font-size:.8rem;font-weight:600;opacity:0;pointer-events:none;transition:opacity .3s;box-shadow:0 4px 16px rgba(0,0,0,.22);}
#notif.show{opacity:1;}

/* PDF LOADING */
#pdf-loading{display:none;position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.55);align-items:center;justify-content:center;flex-direction:column;gap:12px;}
#pdf-loading.show{display:flex;}
.pdf-spinner{width:42px;height:42px;border:4px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
#pdf-loading p{color:#fff;font-size:.88rem;font-weight:600;}
</style>
</head>

function x(s){if(!s)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function rgba(hex,a){const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return`rgba(${r},${g},${b},${a})`;}

function buildSectionHtml(key, tplKey){
  const tpl  = TEMPLATES[tplKey]||TEMPLATES.classic;
  const hex  = ST.accent;
  const light= rgba(hex,.12);
  const bord = rgba(hex,.4);
  const secTitleStyle = tpl.sectionTitleStyle(hex,light,bord);
  const entStyle      = tpl.entryTitleStyle ? tpl.entryTitleStyle(hex) : `color:#111;`;
  const skillStyle    = tpl.skillTagStyle(hex,light,bord);

  switch(key){
    case 'summary':
      if(!data.summary) return '';
      return `<div class="r-section"><div class="r-section-title" style="${secTitleStyle}">Professional Summary</div>
        <div class="r-summary">${x(data.summary)}</div></div>`;

    case 'experience':{
      if(!data.experience.length) return '';
      let h=`<div class="r-section"><div class="r-section-title" style="${secTitleStyle}">Work Experience</div>`;
      data.experience.forEach(exp=>{
        h+=`<div class="r-entry">
          <div class="r-entry-head">
            <span class="r-entry-title" style="${entStyle}">${x(exp.title)}</span>
            <span class="r-entry-date">${x(exp.date)}</span>
          </div>
          <div class="r-entry-sub">${x(exp.company)}${exp.location?' · '+x(exp.location):''}</div>`;
        if(exp.bullets&&exp.bullets.length)
          h+='<ul>'+exp.bullets.filter(b=>b).map(b=>`<li>${x(b)}</li>`).join('')+'</ul>';
        h+='</div>';
      });
      return h+'</div>';}

    case 'education':{
      if(!data.education.length) return '';
      let h=`<div class="r-section"><div class="r-section-title" style="${secTitleStyle}">Education</div>`;
      data.education.forEach(edu=>{
        h+=`<div class="r-entry">
          <div class="r-entry-head">
            <span class="r-entry-title" style="${entStyle}">${x(edu.degree)}</span>
            <span class="r-entry-date">${x(edu.date)}</span>
          </div>
          <div class="r-entry-sub">${x(edu.school)}${edu.location?' · '+x(edu.location):''}</div>
          ${edu.detail?`<div class="r-entry-desc">${x(edu.detail)}</div>`:''}
        </div>`;
      });
      return h+'</div>';}

    case 'internships':{
      if(!data.internships.length) return '';
      let h=`<div class="r-section"><div class="r-section-title" style="${secTitleStyle}">Internships</div>`;
      data.internships.forEach(intern=>{
        h+=`<div class="r-entry">
          <div class="r-entry-head">
            <span class="r-entry-title" style="${entStyle}">${x(intern.title)}</span>
            <span class="r-entry-date">${x(intern.date)}</span>
          </div>
          <div class="r-entry-sub">${x(intern.company)}${intern.location?' · '+x(intern.location):''}</div>`;
        if(intern.bullets&&intern.bullets.length)
          h+='<ul>'+intern.bullets.filter(b=>b).map(b=>`<li>${x(b)}</li>`).join('')+'</ul>';
        h+='</div>';
      });
      return h+'</div>';}

    case 'skills':
      if(!data.skills.length) return '';
      return `<div class="r-section"><div class="r-section-title" style="${secTitleStyle}">Skills</div>
        <div class="r-skills-grid">${data.skills.map(s=>`<span class="r-skill-tag" style="${skillStyle}">${x(s)}</span>`).join('')}</div>
      </div>`;

    case 'courses':{
      if(!data.courses.length) return '';
      let h=`<div class="r-section"><div class="r-section-title" style="${secTitleStyle}">Certifications &amp; Courses</div><div class="r-courses-grid">`;
      data.courses.forEach(c=>{
        h+=`<div class="r-course-row">
          <span class="r-course-name">${x(c.name)}${c.issuer?` <span style="color:#888">— ${x(c.issuer)}</span>`:''}</span>
          <span class="r-course-date">${x(c.date)}</span>
        </div>`;
      });
      return h+'</div></div>';}

    case 'organizations':
      if(!data.organizations.length) return '';
      return `<div class="r-section"><div class="r-section-title" style="${secTitleStyle}">Organizations</div>
        <ul>${data.organizations.map(o=>`<li>${x(o)}</li>`).join('')}</ul>
      </div>`;

    case 'languages':
      if(!data.languages.length) return '';
      return `<div class="r-section"><div class="r-section-title" style="${secTitleStyle}">Languages</div>
        <div class="r-lang-list">${data.languages.map(l=>`
          <div class="r-lang-row">
            <span class="r-lang-name">${x(l.name)}</span>
            <span class="r-lang-badge" style="background:${rgba(hex,.1)};color:${hex};border:1px solid ${rgba(hex,.3)};padding:1px 7px;border-radius:3px;font-size:7.5pt;font-weight:600;">${x(l.proficiency||'')}</span>
          </div>`).join('')}
        </div></div>`;

    case 'personalInfo':{
      const p=data.personalInfo;
      let h=`<div class="r-section"><div class="r-section-title" style="${secTitleStyle}">Personal Information</div><div class="r-info-list">`;
      if(p.address)     h+=`<div class="r-info-row"><span class="r-info-label">Address</span><span class="r-info-val">${x(p.address)}</span></div>`;
      if(p.dob)         h+=`<div class="r-info-row"><span class="r-info-label">Place of Birth</span><span class="r-info-val">${x(p.dob)}</span></div>`;
      if(p.nationality) h+=`<div class="r-info-row"><span class="r-info-label">Nationality</span><span class="r-info-val">${x(p.nationality)}</span></div>`;
      if(p.license)     h+=`<div class="r-info-row"><span class="r-info-label">Driving License</span><span class="r-info-val">${x(p.license)}</span></div>`;
      return h+'</div></div>';}

    default: return '';
  }
}

    const p=d.personalInfo;
    h+=`<div class="tc-section-title">Personal Info</div>`;

    if(p.dob)         h+=`<div class="tc-info-row"><span class="tc-info-label">Place of Birth</span>${x(p.dob)}</div>`;
    if(p.nationality) h+=`<div class="tc-info-row"><span class="tc-info-label">Nationality</span>${x(p.nationality)}</div>`;
    if(p.license)     h+=`<div class="tc-info-row"><span class="tc-info-label">License</span>${x(p.license)}</div>`;

// ─────────────────────────────────────────────────────────────
// PAGE-AWARE RENDER ENGINE
//
// Strategy:
//   1. Render ALL blocks into a hidden off-screen container
//      to measure their real pixel heights.
//   2. Walk through blocks, accumulating height.
//      When adding a block would overflow the current page,
//      start a new page — never split a block.
//   3. Each "block" = header OR one section element.
//   4. The visible preview shows physical page boxes with a
//      gap label between them (gap div is preview-only).
//   5. The PDF clone is a single continuous <div> with
//      page-break-inside:avoid on each block — jsPDF handles
//      the page breaking cleanly with no UI labels.
// ─────────────────────────────────────────────────────────────

const MM_PX = 3.7795275591; // 1mm = 3.7795… px at 96 dpi

function mmToPx(mm){ return mm * MM_PX; }

function makeHiddenStage(){
  // Off-screen container at exact 210mm width
  const stage = document.createElement('div');
  stage.style.cssText = `
    position:fixed;left:-9999px;top:0;
    width:210mm;visibility:hidden;pointer-events:none;z-index:-1;
  `;
  const st = document.createElement('style');
  st.textContent = resumeCSS();
  stage.appendChild(st);
  return stage;
}

/**
 * Build an array of {el, html} blocks for the current template.
 * Each block is a self-contained DOM node whose height we'll measure.
 */
function buildBlocks(tplKey){
  const tpl = TEMPLATES[tplKey] || TEMPLATES.classic;
  const hex = ST.accent;
  const blocks = [];

  // --- Two-column is special: one big block (no splittable sections)
  if(tplKey === 'twocol'){
    const rightSections = ['summary','experience','education','internships','courses','organizations'];
    let rightHtml = '';
    sectionOrder.forEach(k => {
      if(!sectionVis[k]) return;
      if(!rightSections.includes(k)) return;
      rightHtml += buildSectionHtml(k, tplKey);
    });
    const wrapper = tpl.wrapContent(rightHtml, data, hex, rgba(hex,.12), rgba(hex,.4), ST.marginV, ST.marginH, buildTwoColLeft);
    const el = document.createElement('div');
    el.className = 'r-page-inner';
    el.style.padding = '0'; // tc-wrap handles its own padding
    el.innerHTML = wrapper;
    blocks.push(el);
    return blocks;
  }

  // --- Single-column templates ---
  // Header block
  let headerHtml = tpl.headerHtml(data, hex);
  // Executive: replace placeholder vars
  headerHtml = headerHtml.replace(/VAR_MVmm/g, ST.marginV+'mm').replace(/VAR_MHmm/g, ST.marginH+'mm');
  const headerEl = document.createElement('div');
  headerEl.innerHTML = headerHtml;
  blocks.push(headerEl);

  // Section blocks
  sectionOrder.forEach(key => {
    if(!sectionVis[key]) return;
    const html = buildSectionHtml(key, tplKey);
    if(!html) return;
    const el = document.createElement('div');
    el.innerHTML = html;
    blocks.push(el);
  });

  return blocks;
}

/**
 * Measure heights of all blocks in a hidden stage.
 * Returns array of px heights.
 */
function measureBlocks(blocks){
  const stage = makeHiddenStage();
  const wrapper = document.createElement('div');
  wrapper.className = 'r-page-inner';
  blocks.forEach(b => wrapper.appendChild(b.cloneNode(true)));
  stage.appendChild(wrapper);
  document.body.appendChild(stage);

  const heights = [];
  for(let i = 0; i < wrapper.children.length; i++){
    heights.push(wrapper.children[i].getBoundingClientRect().height);
  }
  document.body.removeChild(stage);
  return heights;
}

/**
 * Given blocks + heights, bin them into pages.
 * Returns array of arrays: pages[pageIndex] = [blockIndex, ...]
 */
function paginateBlocks(heights, tplKey){
  const pageH = mmToPx(297);
  const padV  = mmToPx(ST.marginV);
  const usable = pageH - 2 * padV;

  const pages = [[]];
  let used = 0;

  heights.forEach((h, i) => {
    // If a single block is taller than a page, still place it alone
    if(used + h > usable && pages[pages.length-1].length > 0){
      pages.push([]);
      used = 0;
    }
    pages[pages.length-1].push(i);
    used += h;
  });
  return pages;
}

/**
 * Main render: builds the visual preview (page boxes + gap labels)
 */
function renderPages(){
  const wrapper = document.getElementById('preview-wrapper');
  wrapper.innerHTML = '';

  const tplKey = currentTpl;
  const blocks = buildBlocks(tplKey);
  const heights = measureBlocks(blocks);
  const pages = paginateBlocks(heights, tplKey);
  const numPages = pages.length;
  const showNums = ST.showPageNums !== false;

  // Helper: create a page-number label element
  function makePageNum(pi){
    const el = document.createElement('div');
    el.className = 'r-page-num';
    el.textContent = numPages > 1 ? `${pi + 1} / ${numPages}` : '';
    return el;
  }

  // Two-column: render as a single page box
  if(tplKey === 'twocol'){
    const page = document.createElement('div');
    page.className = 'resume-page';
    page.style.height = 'auto';
    page.style.minHeight = '297mm';
    const st = document.createElement('style');
    st.textContent = resumeCSS();
    page.appendChild(st);
    const inner = blocks[0].cloneNode(true);
    page.appendChild(inner);
    if(showNums && numPages > 1) page.appendChild(makePageNum(0));
    wrapper.appendChild(page);
    setTimeout(()=>applyZoom(parseInt(zoomRange.value)),80);
    return;
  }

  // Single-column: render each page as a physical box
  for(let pi = 0; pi < numPages; pi++){
    const pageEl = document.createElement('div');
    pageEl.className = 'resume-page';

    const st = document.createElement('style');
    st.textContent = resumeCSS();
    pageEl.appendChild(st);

    const inner = document.createElement('div');
    inner.className = 'r-page-inner';
    // Reserve bottom space for page number if enabled and multi-page
    if(showNums && numPages > 1){
      inner.style.paddingBottom = `${ST.marginV + 5}mm`;
    }

    pages[pi].forEach(bi => {
      inner.appendChild(blocks[bi].cloneNode(true));
    });

    pageEl.appendChild(inner);

    // Page number — appended directly to page (absolute positioned)
    if(showNums && numPages > 1){
      pageEl.appendChild(makePageNum(pi));
    }

    wrapper.appendChild(pageEl);

    // Gap between pages (preview-only)
    if(pi < numPages - 1){
      const gap = document.createElement('div');
      gap.className = 'page-gap';
      const lbl = document.createElement('div');
      lbl.className = 'page-gap-label';
      lbl.textContent = `page ${pi+1} of ${numPages}`;
      gap.appendChild(lbl);
      wrapper.appendChild(gap);
    }
  }

  // Footer count label (preview-only)
  if(numPages > 1){
    const footer = document.createElement('div');
    footer.className = 'page-count-footer';
    footer.textContent = `${numPages} pages total`;
    wrapper.appendChild(footer);
  }

  setTimeout(()=>applyZoom(parseInt(zoomRange.value)), 80);
}

// ─────────────────────────────────────────────────────────────
// ZOOM  — scroll-safe implementation
// The wrapper is scaled from top-center. After scaling, its
// layout box still occupies the ORIGINAL size, so scroll works
// normally to the top. We just need to make sure #main-inner
// is tall enough to not clip the bottom of scaled content.
// ─────────────────────────────────────────────────────────────
const zoomRange = document.getElementById('zoom-range');
const zoomVal   = document.getElementById('zoom-val');
const previewWrapper = document.getElementById('preview-wrapper');

function applyZoom(v){
  const scale = v / 100;
  previewWrapper.style.transform = `scale(${scale})`;
  zoomVal.textContent = v + '%';
  // After scaling, the wrapper's layout height stays at natural size.
  // When scale < 1 the bottom gets clipped by the scroll container,
  // so we pad #main-inner enough to accommodate the scaled height.
  requestAnimationFrame(() => {
    const naturalH = previewWrapper.offsetHeight;       // unscaled layout height
    const scaledH  = naturalH * scale;                  // visible height after scale
    const mainInner = document.getElementById('main-inner');
    // Set min-height so the scroll area is always correct
    mainInner.style.minHeight = (scaledH + 88) + 'px';
  });
}
zoomRange.addEventListener('input', () => applyZoom(parseInt(zoomRange.value)));

// PDF EXPORT — clean clone, no UI labels
// ─────────────────────────────────────────────────────────────
async function downloadPDF(){
  const loading = document.getElementById('pdf-loading');
  loading.classList.add('show');
  try{
    const tpl = TEMPLATES[currentTpl] || TEMPLATES.classic;
    const hex = ST.accent;

    // Build a clean, standalone container — NO page-gap labels, NO UI elements
    const container = document.createElement('div');
    container.style.cssText = 'width:210mm;';

    const st = document.createElement('style');
    st.textContent = resumeCSS() + `
      /* Extra PDF safety */
      .r-section{page-break-inside:avoid!important;break-inside:avoid!important;}
      .r-entry{page-break-inside:avoid!important;break-inside:avoid!important;}
      .r-section-title{page-break-after:avoid!important;break-after:avoid!important;}
      .r-page-inner{width:210mm;padding:${ST.marginV}mm ${ST.marginH}mm;}
    `;
    container.appendChild(st);

    if(currentTpl === 'twocol'){
      const rightSections = ['summary','experience','education','internships','courses','organizations'];
      let rightHtml = '';
      sectionOrder.forEach(k => {
        if(!sectionVis[k]) return;
        if(!rightSections.includes(k)) return;
        rightHtml += buildSectionHtml(k, 'twocol');
      });
      const content = document.createElement('div');
      content.innerHTML = tpl.wrapContent(rightHtml, data, hex, rgba(hex,.12), rgba(hex,.4), ST.marginV, ST.marginH, buildTwoColLeft);
      container.appendChild(content);
    } else {
      const content = document.createElement('div');
      content.className = 'r-page-inner';
      // Header
      let hHtml = tpl.headerHtml(data, hex);
      hHtml = hHtml.replace(/VAR_MVmm/g, ST.marginV+'mm').replace(/VAR_MHmm/g, ST.marginH+'mm');
      content.innerHTML = hHtml;
      // Sections
      sectionOrder.forEach(key => {
        if(!sectionVis[key]) return;
        const html = buildSectionHtml(key, currentTpl);
        if(!html) return;
        const el = document.createElement('div');
        el.style.cssText = 'page-break-inside:avoid;break-inside:avoid;';
        el.innerHTML = html;
        content.appendChild(el);
      });
      container.appendChild(content);
    }

    await html2pdf().set({
      margin: 0,
      filename: 'Ronald_Sebastian_Resume.pdf',
      image: { type: 'jpeg', quality: 1 },
      html2canvas: { scale: 2, useCORS: true, letterRendering: true },
      jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait', compress: true, hotfixes: ['px_scaling'] },
      pagebreak: { mode: ['avoid-all', 'css', 'legacy'], before: '.page-break-before', avoid: ['.r-section','.r-entry'] }
    }).from(container).save();

    notify('PDF downloaded!');
  } catch(err){
    console.error(err);
    notify('Error generating PDF — check console.');
  } finally {
    loading.classList.remove('show');
  }
}

let dragSrc = null;
function initDrag(){
  document.querySelectorAll('.section-item').forEach(item=>{
    item.addEventListener('dragstart', e=>{ dragSrc=item; item.classList.add('dragging'); e.dataTransfer.effectAllowed='move'; });
    item.addEventListener('dragend',   ()=>{ item.classList.remove('dragging'); dragSrc=null; });
    item.addEventListener('dragover',  e=>{ e.preventDefault();
      if(dragSrc&&dragSrc!==item){ const p=item.parentNode,arr=[...p.children],si=arr.indexOf(dragSrc),ti=arr.indexOf(item);
        if(si<ti) p.insertBefore(dragSrc,item.nextSibling); else p.insertBefore(dragSrc,item); }
    });
    item.addEventListener('drop', ()=>{ sectionOrder=[...document.querySelectorAll('.section-item')].map(i=>i.dataset.key); renderPages(); persist(); });
  });
}

function initStylePanel(){
  const presets = document.getElementById('color-presets');
  COLOR_PRESETS.forEach(c=>{
    const dot = document.createElement('div');
    dot.className = 'color-dot' + (c===ST.accent?' active':'');
    dot.style.background = c; dot.title = c;
    dot.addEventListener('click', ()=>{
      ST.accent=c; document.getElementById('color-picker').value=c;
      document.querySelectorAll('.color-dot').forEach(d=>d.classList.remove('active'));
      dot.classList.add('active'); renderPages(); persist();
    });
    presets.appendChild(dot);
  });
  document.getElementById('color-picker').value  = ST.accent;
  document.getElementById('font-select').value   = ST.font;
  document.getElementById('font-size').value     = ST.fontSize;
  document.getElementById('line-height').value   = ST.lineHeight;
  document.getElementById('margin-v').value      = ST.marginV;
  document.getElementById('margin-h').value      = ST.marginH;

  document.getElementById('color-picker').addEventListener('input', e=>{ ST.accent=e.target.value; document.querySelectorAll('.color-dot').forEach(d=>d.classList.remove('active')); renderPages(); persist(); });

  // Font-family has its own handler so we can auto-adjust line-height
  // Sans-serif fonts (Arial, Calibri, Trebuchet) have taller x-heights than
  // serif fonts — 1.45 line-height for Times looks like 1.6+ for Arial.
  // We nudge the default line-height down for sans fonts automatically,
  // but only if the user hasn't manually changed it from the last auto value.
  const FONT_LH = {
    "'Times New Roman',Times,serif": 1.45,
    "Georgia,serif":                 1.45,
    "Arial,Helvetica,sans-serif":    1.30,
    "Calibri,sans-serif":            1.30,
    "'Trebuchet MS',sans-serif":     1.32,
  };
  let _lastAutoLH = FONT_LH[ST.font] || 1.45; // track last auto-set value

  document.getElementById('font-select').addEventListener('change', ()=>{
    ST.font = document.getElementById('font-select').value;
    // Only auto-adjust line-height if user hasn't deviated from auto values
    const currentLH = parseFloat(document.getElementById('line-height').value);
    const autoLH    = FONT_LH[ST.font] || 1.40;
    // Snap to new auto value if user is still on an auto value
    if(Math.abs(currentLH - _lastAutoLH) < 0.01){
      ST.lineHeight = autoLH;
      document.getElementById('line-height').value = autoLH;
      _lastAutoLH = autoLH;
    } else {
      ST.lineHeight = currentLH;
    }
    renderPages(); persist();
  });

  ['font-size','line-height','margin-v','margin-h'].forEach(id=>{
    document.getElementById(id).addEventListener('change', ()=>{
      ST.fontSize   = parseFloat(document.getElementById('font-size').value);
      ST.lineHeight = parseFloat(document.getElementById('line-height').value);
      ST.marginV    = parseFloat(document.getElementById('margin-v').value);
      ST.marginH    = parseFloat(document.getElementById('margin-h').value);
      renderPages(); persist();
    });
  });
}

    data.languages.forEach((lang,i)=>{

      const ni=document.createElement('input'); ni.value=lang.name; ni.placeholder='Language'; ni.style.cssText='flex:1;padding:5px 8px;border-radius:6px;border:1px solid var(--g300);font-size:.78rem;';
      ni.addEventListener('input',()=>{ lang.name=ni.value; renderPages(); persist(); });
      const sel=document.createElement('select'); sel.style.cssText='width:130px;padding:5px 7px;border-radius:6px;border:1px solid var(--g300);font-size:.75rem;font-family:var(--ui);background:#fff;color:var(--g800);';
      LEVELS.forEach(lv=>{ const opt=document.createElement('option'); opt.value=lv; opt.textContent=lv; if((lang.proficiency||'')===lv) opt.selected=true; sel.appendChild(opt); });
      sel.addEventListener('change',()=>{ lang.proficiency=sel.value; renderPages(); persist(); });
      const rm=document.createElement('button'); rm.className='btn-rm'; rm.textContent='✕';
      rm.addEventListener('click',()=>{ data.languages.splice(i,1); render(); renderPages(); persist(); });
      row.appendChild(ni); row.appendChild(sel); row.appendChild(rm); w.appendChild(row);
    });
    const a=document.createElement('button'); a.className='btn-add'; a.textContent='+ Add Language';
    a.addEventListener('click',()=>{ data.languages.push({name:'',proficiency:'Intermediate'}); render(); renderPages(); persist(); });
    w.appendChild(a);
  }
  render(); return w;
}
function buildCoursesEd(){
  const w=document.createElement('div'); w.style.cssText='display:flex;flex-direction:column;gap:7px;';
  function render(){
    w.innerHTML='';
    data.courses.forEach((c,i)=>{
      const card=document.createElement('div'); card.className='subsection-card';
      const t=document.createElement('div'); t.className='card-title';
      t.innerHTML=`<span>#${i+1} ${c.name||'Course'}</span>`;
      const rm=document.createElement('button'); rm.className='btn-rm'; rm.textContent='✕';
      rm.addEventListener('click',()=>{ data.courses.splice(i,1); render(); renderPages(); persist(); });
      t.appendChild(rm); card.appendChild(t);
      [['Course Name','name'],['Issuer','issuer'],['Date','date']].forEach(([l,k])=>card.appendChild(fld(l,c[k],v=>c[k]=v)));
      w.appendChild(card);
    });
    const a=document.createElement('button'); a.className='btn-add'; a.textContent='+ Add Course';
    a.addEventListener('click',()=>{ data.courses.push({name:'',issuer:'',date:''}); render(); renderPages(); persist(); });
    w.appendChild(a);
  }
  render(); return w;
}
function buildOrgsEd(){
  const w=document.createElement('div'); w.style.cssText='display:flex;flex-direction:column;gap:5px;';
  function render(){
    w.innerHTML='';
    data.organizations.forEach((org,i)=>{
      const row=document.createElement('div'); row.className='list-item-row';
      const inp=document.createElement('input'); inp.value=org; inp.style.cssText='flex:1;padding:5px 8px;border-radius:6px;border:1px solid var(--g300);font-size:.78rem;';
      inp.addEventListener('input',()=>{ data.organizations[i]=inp.value; renderPages(); persist(); });
      const rm=document.createElement('button'); rm.className='btn-rm'; rm.textContent='✕';
      rm.addEventListener('click',()=>{ data.organizations.splice(i,1); render(); renderPages(); persist(); });
      row.appendChild(inp); row.appendChild(rm); w.appendChild(row);
    });
    const a=document.createElement('button'); a.className='btn-add'; a.textContent='+ Add';
    a.addEventListener('click',()=>{ data.organizations.push(''); render(); renderPages(); persist(); });
    w.appendChild(a);
  }
  render(); return w;
}

// ─────────────────────────────────────────────────────────────
// EXPORT / RESET
// ─────────────────────────────────────────────────────────────
function exportJSON(){
  const blob=new Blob([JSON.stringify({data,sectionOrder,sectionVis,ST,currentTpl},null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download='resume_data.json'; a.click(); URL.revokeObjectURL(url);
  notify('JSON exported!');
}
function resetData(){
  if(!confirm('Reset all changes to default?')) return;
  data        = JSON.parse(JSON.stringify(DEFAULT_DATA));
  sectionOrder= SECTION_META.map(s=>s.key);
  sectionVis  = Object.fromEntries(SECTION_META.map(s=>[s.key,true]));
  ST          = {accent:"#1a56db",font:"'Times New Roman',Times,serif",fontSize:10,lineHeight:1.45,marginV:14,marginH:16};
  currentTpl  = 'classic';
  localStorage.removeItem('resumeEditorV3');
  document.getElementById('tpl-select').value   = 'classic';
  document.getElementById('color-picker').value = ST.accent;
  document.getElementById('font-select').value  = ST.font;
  document.getElementById('font-size').value    = ST.fontSize;
  document.getElementById('line-height').value  = ST.lineHeight;
  document.getElementById('margin-v').value     = ST.marginV;
  document.getElementById('margin-h').value     = ST.marginH;
  document.querySelectorAll('.color-dot').forEach(d=>d.classList.remove('active'));
  document.querySelector(`.color-dot[title="${ST.accent}"]`)?.classList.add('active');
  renderSectionList(); renderPages(); renderEditorPanel();
  notify('Reset to default!');
}

// ─────────────────────────────────────────────────────────────
// INIT
// ─────────────────────────────────────────────────────────────
initStylePanel();
renderSectionList();
renderPages();
</script>
